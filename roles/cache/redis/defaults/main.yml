---
# Image
redis_version: "7.2.4-alpine"
redis_exporter_version: "v1.58.0"

# Network
redis_port: 6379
redis_exporter_port: 9121

# Credentials
redis_password: "{{ lookup('env', 'REDIS_PASSWORD') | default('redis_strong_password_change_me', true) }}"

# Paths
redis_data_dir: "/opt/airpay/redis/data"
redis_compose_dir: "/opt/airpay/redis"

