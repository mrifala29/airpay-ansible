---
- name: Create Prometheus Directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: ubuntu
    group: docker
  loop:
    - "{{ prometheus_compose_dir }}"
    - "{{ prometheus_compose_dir }}/targets"

- name: Ensure Prometheus Data Directory Permissions
  file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    mode: '0755'
    owner: "65534"
    group: "65534"

- name: Template Prometheus Configuration
  template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_compose_dir }}/prometheus.yml"
    mode: '0644'
  notify:
    - Reload Prometheus
    - Restart Prometheus

- name: Template Prometheus Compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ prometheus_compose_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart Prometheus

- name: Start Prometheus
  command: docker compose up -d
  args:
    chdir: "{{ prometheus_compose_dir }}"
  register: compose_output
  changed_when: "'Started' in compose_output.stdout or 'Created' in compose_output.stdout"
