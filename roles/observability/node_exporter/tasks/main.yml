---
- name: Create Node Exporter Directory
  file:
    path: "{{ node_exporter_compose_dir }}"
    state: directory
    mode: '0755'
    owner: ubuntu
    group: docker

- name: Template Node Exporter Compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ node_exporter_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Node Exporter
  command: docker compose up -d
  args:
    chdir: "{{ node_exporter_compose_dir }}"
  register: compose_output
  changed_when: "'Started' in compose_output.stdout or 'Created' in compose_output.stdout"
