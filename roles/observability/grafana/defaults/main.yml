---
# Image
grafana_version: "10.4.1"

# Network
grafana_port: 3000

# Credentials
grafana_admin_user: "admin"
grafana_admin_password: "{{ vault_grafana_admin_password | default(lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default('grafana_prod_secret_pass', true)) }}"

# Paths
grafana_compose_dir: "/opt/airpay/grafana"
grafana_data_dir: "/opt/airpay/grafana/data"

# Datasource Endpoints
prometheus_host: "127.0.0.1"
prometheus_port: 9090
loki_host: "127.0.0.1"
loki_port: 3100
tempo_host: "127.0.0.1"
tempo_port: 3200
