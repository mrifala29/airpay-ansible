---
# Image
grafana_version: "10.4.1"
prometheus_version: "v2.51.0"

# Network
grafana_port: 3000
prometheus_port: 9090

# Credentials
grafana_admin_user: "admin"
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default('grafana_prod_secret_pass', true) }}"

# Paths
grafana_data_dir: "/opt/airpay/grafana/data"
grafana_compose_dir: "/opt/airpay/grafana"
prometheus_data_dir: "/opt/airpay/grafana/prometheus_data"
loki_data_dir: "/opt/airpay/grafana/loki_data"
tempo_data_dir: "/opt/airpay/grafana/tempo_data"

# Loki & Tempo Versions & Ports
loki_version: "3.0.0"
tempo_version: "2.4.1"
loki_port: 3100
tempo_port: 3200
tempo_otlp_grpc_port: 4317
tempo_otlp_http_port: 4318
