---
- name: Restart Grafana
  command: docker compose restart grafana
  args:
    chdir: "{{ grafana_compose_dir }}"

- name: Reload Prometheus
  uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/-/reload"
    method: POST
    status_code: 200
  ignore_errors: true

- name: Restart Prometheus
  command: docker compose restart prometheus
  args:
    chdir: "{{ grafana_compose_dir }}"

- name: Restart Loki
  command: docker compose restart loki
  args:
    chdir: "{{ grafana_compose_dir }}"

- name: Restart Tempo
  command: docker compose restart tempo
  args:
    chdir: "{{ grafana_compose_dir }}"
