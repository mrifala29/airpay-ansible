---
- name: Create Loki Compose Directory
  file:
    path: "{{ loki_compose_dir }}"
    state: directory
    mode: '0755'
    owner: ubuntu
    group: docker

- name: Ensure Loki Data Directory Permissions
  file:
    path: "{{ loki_data_dir }}"
    state: directory
    mode: '0775'
    owner: "10001"
    group: "10001"

- name: Template Loki Configuration
  template:
    src: loki-config.yml.j2
    dest: "{{ loki_compose_dir }}/loki.yml"
    mode: '0644'
  notify: Restart Loki

- name: Template Loki Compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ loki_compose_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart Loki

- name: Start Loki
  command: docker compose up -d
  args:
    chdir: "{{ loki_compose_dir }}"
  register: compose_output
  changed_when: "'Started' in compose_output.stdout or 'Created' in compose_output.stdout"
