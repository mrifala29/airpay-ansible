---
# Image
keycloak_version: "24.0.2"
keycloak_db_version: "15.6-alpine"

# Network
keycloak_port: 8080

# Credentials
keycloak_admin_user: "admin"
keycloak_admin_password: "{{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') | default('kc_strong_password', true) }}"
keycloak_db_name: "keycloak"
keycloak_db_user: "keycloak"
keycloak_db_password: "{{ lookup('env', 'KEYCLOAK_DB_PASSWORD') | default('kc_db_strong_password', true) }}"

# Command
keycloak_command: "start-dev"

# Paths
keycloak_data_dir: "/opt/airpay/keycloak/data"
keycloak_compose_dir: "/opt/airpay/keycloak"
