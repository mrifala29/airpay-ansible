---
- name: Mount EBS data disk
  include_tasks: ../../base/common/tasks/mount_disk.yml
  vars:
    target_mount_dir: "{{ scylla_data_dir }}"
    mount_owner: "ubuntu"
    mount_group: "docker"

- name: Create Compose Directory
  file:
    path: "{{ scylla_compose_dir }}"
    state: directory
    mode: '0755'
    owner: ubuntu
    group: docker

- name: Template Compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ scylla_compose_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart Scylla

- name: Start Scylla
  command: docker compose up -d
  args:
    chdir: "{{ scylla_compose_dir }}"
  register: compose_output
  changed_when: "'Started' in compose_output.stdout or 'Created' in compose_output.stdout"
